    light_expression: var(--lfe-plum-tagline-light)
    light_hex: '#704968'
    dark_expression: var(--lfe-plum-tagline-dark)
    dark_hex: '#dbadd0'
  - name: --lfe-text-muted
    key: lfe-text-muted
    kind: site
    category: Text and identity accents
    purpose: Lower-emphasis text that remains readable on its intended surface.
    consumers: Supporting labels, quiet metadata, and muted utility classes.
    light_expression: var(--lfe-slate-600)
    light_hex: '#4d5369'
    dark_expression: var(--lfe-slate-muted-dark)
    dark_hex: '#bcc3d6'
  - name: --lfe-text-primary
    key: lfe-text-primary
    kind: site
    category: Text and identity accents
    purpose: Main reading text on panels and the page canvas.
    consumers: Headings, body text utilities, controls, and Pagefind results.
    light_expression: var(--lfe-slate-800)
    light_hex: '#23273b'
    dark_expression: var(--lfe-slate-200)
    dark_hex: '#e4e7f0'
  - name: --lfe-text-secondary
    key: lfe-text-secondary
    kind: site
    category: Text and identity accents
    purpose: Supporting reading text below primary emphasis.
    consumers: Paragraphs, details, code captions, and secondary Pagefind text.
    light_expression: var(--lfe-slate-700)
    light_hex: '#393f55'
    dark_expression: var(--lfe-slate-300)
    dark_hex: '#ced4e1'
